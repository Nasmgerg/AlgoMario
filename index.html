<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mario AI Web</title>
    <link rel="icon" type="image/png" href="/src/assets/sprites/icon-game.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0d1117;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        color: #e6edf3;
      }
      #app {
        display: flex;
        width: 100%;
        height: 100%;
      }
      #game-container {
        flex: 1 1 auto;
        min-width: 0;
        height: 100%;
      }
      #sidebar {
        flex: 0 0 300px;
        height: 100%;
        overflow-y: auto;
        background: #161b22;
        border-left: 1px solid #30363d;
        padding: 12px;
        box-sizing: border-box;
        font-size: 13px;
      }
      /* Benchmark módban a canvas elrejtve → a sidebar kapja a teljes szélességet. */
      #game-container[style*='none'] + #sidebar {
        flex: 1 1 auto;
      }
      /* Keskeny (telefon) nézet: a 300px-es sidebar vízszintesen a viewport
         nagy részét elvinné, a canvas vékony csíkra szorulna. Ezért
         függőleges elrendezés: canvas felül fix magasságon, a statisztika
         alatta görgethetően. */
      @media (max-width: 700px) {
        #app {
          flex-direction: column;
        }
        #game-container {
          flex: 0 0 55vh;
          width: 100%;
          height: 55vh;
        }
        #sidebar {
          flex: 1 1 auto;
          width: 100%;
          height: auto;
          min-height: 0;
          border-left: none;
          border-top: 1px solid #30363d;
        }
      }
      .controls {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-bottom: 12px;
        border-bottom: 1px solid #30363d;
      }
      .ctl-field {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .ctl-field > span {
        color: #8b949e;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .ctl-field:has(input[type='checkbox']) {
        flex-direction: row;
        align-items: center;
        gap: 8px;
      }
      .ctl-field input[type='checkbox'] {
        width: 16px;
        height: 16px;
      }
      .ctl-with-value {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ctl-with-value input[type='range'] {
        flex: 1 1 auto;
        min-width: 0;
      }
      .ctl-with-value b {
        flex: 0 0 auto;
        font-size: 11px;
        color: #7ee787;
        white-space: nowrap;
      }
      select,
      input[type='number'],
      button {
        background: #0d1117;
        color: #e6edf3;
        border: 1px solid #30363d;
        border-radius: 5px;
        padding: 5px 6px;
        font-size: 13px;
      }
      button {
        cursor: pointer;
        background: #21262d;
      }
      button:hover {
        background: #30363d;
      }
      .stats-panel h3 {
        margin: 12px 0 4px;
        font-size: 14px;
        color: #79c0ff;
      }
      .stat-phase {
        color: #8b949e;
        margin-bottom: 8px;
        font-size: 12px;
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 2px 0;
        border-bottom: 1px dotted #21262d;
      }
      .stat-row span {
        color: #8b949e;
      }
      .stat-warning {
        background: #4a1d1d;
        border: 1px solid #f85149;
        border-radius: 5px;
        padding: 6px;
        margin-bottom: 8px;
        font-size: 12px;
      }
      .stat-note {
        color: #d29922;
        font-size: 11px;
        margin-top: 6px;
      }
      .stat-good {
        color: #3fb950;
        font-size: 11px;
        margin-top: 6px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
        font-size: 11px;
        color: #8b949e;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 3px;
        vertical-align: middle;
      }
      hr {
        border: none;
        border-top: 1px solid #30363d;
        margin: 8px 0;
      }
      /* --- Race panel (SPEC 8.3) --- */
      .race-banner {
        margin: 8px 0 4px;
        padding: 8px;
        border-radius: 6px;
        text-align: center;
        font-weight: bold;
        background: #21262d;
      }
      .race-banner.player {
        background: #1b4721;
        color: #7ee787;
      }
      .race-banner.ai {
        background: #3a2a5e;
        color: #b388ff;
      }
      .race-table,
      .bench-table,
      .bench-summary {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        margin-top: 6px;
      }
      .race-table th,
      .race-table td,
      .bench-summary th,
      .bench-summary td {
        padding: 3px 5px;
        border-bottom: 1px solid #21262d;
        text-align: right;
      }
      .race-table td:first-child,
      .bench-summary td:first-child {
        text-align: left;
        color: #8b949e;
      }
      .race-table td.win {
        color: #7ee787;
        font-weight: bold;
      }
      /* --- Benchmark panel (SPEC 8.4) --- */
      .table-scroll {
        overflow-x: auto;
        max-height: 55vh;
        overflow-y: auto;
        border: 1px solid #21262d;
        border-radius: 6px;
        margin-top: 6px;
      }
      .bench-table th,
      .bench-table td {
        padding: 3px 6px;
        border-bottom: 1px solid #21262d;
        text-align: right;
        white-space: nowrap;
      }
      .bench-table th {
        position: sticky;
        top: 0;
        background: #21262d;
        cursor: pointer;
        user-select: none;
      }
      .bench-table th:hover {
        background: #30363d;
      }
      .bench-table td.optimal,
      .bench-summary td.optimal {
        color: #3fb950;
        font-weight: bold;
      }
      .bench-summary th {
        background: #21262d;
      }
      .csv-button {
        margin-top: 8px;
      }
      h4 {
        margin: 12px 0 2px;
        font-size: 12px;
        color: #8b949e;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      /* --- Kezdőoldal --- */
      #landing {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        width: 100%;
        height: 100%;
        overflow-y: auto;
        padding: 24px 16px;
        box-sizing: border-box;
        text-align: center;
        background: #05070a;
        border: 6px solid #7a2b0a;
        box-shadow: inset 0 0 0 3px #c1440e;
      }
      .landing-banner {
        margin: 0;
        color: #f85149;
        font-size: clamp(9px, 5px + 1vw, 13px);
        line-height: 1.15;
        text-shadow: 0 0 12px rgba(248, 81, 73, 0.35);
        overflow-x: auto;
        max-width: 100%;
        flex-shrink: 0;
      }
      .landing-level {
        margin: 0;
        font-size: clamp(9px, 6px + 1.1vw, 15px);
        line-height: 1.3;
        letter-spacing: 0.05em;
        overflow-x: auto;
        max-width: 100%;
        flex-shrink: 0;
      }
      .tile-wall {
        color: #c1440e;
      }
      .tile-pipe {
        color: #2ea043;
      }
      .tile-surprise,
      .tile-coin {
        color: #ffd400;
      }
      .tile-goal {
        color: #f5f5f5;
      }
      .tile-mario {
        color: #f85149;
        font-weight: bold;
      }
      .landing-legend {
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 4px;
        font-size: 12px;
        color: #8b949e;
      }
      .landing-legend span[class^='tile-'] {
        font-family: monospace;
        font-weight: bold;
      }
      .landing-intro {
        max-width: 620px;
        margin: 0;
        color: #e6edf3;
        line-height: 1.6;
        font-size: 15px;
      }
      .landing-showcase {
        display: grid;
        grid-template-columns: minmax(180px, 240px) auto minmax(180px, 240px);
        grid-template-areas: 'left level right';
        align-items: center;
        gap: 16px;
        max-width: 100%;
        margin: 0;
      }
      .mode-col {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .mode-col-left {
        grid-area: left;
      }
      .mode-col-right {
        grid-area: right;
      }
      .landing-level-wrap {
        grid-area: level;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .mode-tile {
        text-align: left;
        background: #1a0f0a;
        border: 3px solid #7a2b0a;
        border-radius: 4px;
        padding: 8px 10px;
        color: #d8c3b0;
        font-size: 12px;
        line-height: 1.4;
      }
      .mode-tile b {
        display: block;
        color: #ffb703;
        font-size: 13px;
        margin-bottom: 3px;
      }
      @media (max-width: 560px) {
        .landing-showcase {
          grid-template-columns: 1fr;
          grid-template-areas: 'level' 'left' 'right';
        }
      }
      .landing-continue {
        margin-top: 8px;
        padding: 12px 28px;
        font-size: 15px;
        font-weight: bold;
        color: #ffd400;
        background: #7a2b0a;
        border: 1px solid #c1440e;
        border-radius: 3px;
        cursor: pointer;
      }
      .landing-continue:hover {
        background: #932f0a;
      }
    </style>
  </head>
  <body>
    <div id="landing"></div>
    <div id="app" style="display: none">
      <div id="game-container"></div>
      <aside id="sidebar"></aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
