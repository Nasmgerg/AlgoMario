<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mario AI Web</title>
    <link rel="icon" type="image/png" href="/src/assets/sprites/icon-game.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0d1117;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        color: #e6edf3;
      }
      #app {
        display: flex;
        width: 100%;
        height: 100%;
      }
      #game-container {
        flex: 1 1 auto;
        min-width: 0;
        height: 100%;
      }
      #sidebar {
        flex: 0 0 300px;
        height: 100%;
        overflow-y: auto;
        background: #161b22;
        border-left: 1px solid #30363d;
        padding: 12px;
        box-sizing: border-box;
        font-size: 13px;
      }
      /* Benchmark módban a canvas elrejtve → a sidebar kapja a teljes szélességet. */
      #game-container[style*='none'] + #sidebar {
        flex: 1 1 auto;
      }
      .controls {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-bottom: 12px;
        border-bottom: 1px solid #30363d;
      }
      .ctl-field {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .ctl-field > span {
        color: #8b949e;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .ctl-field:has(input[type='checkbox']) {
        flex-direction: row;
        align-items: center;
        gap: 8px;
      }
      .ctl-field input[type='checkbox'] {
        width: 16px;
        height: 16px;
      }
      .ctl-with-value {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ctl-with-value input[type='range'] {
        flex: 1 1 auto;
        min-width: 0;
      }
      .ctl-with-value b {
        flex: 0 0 auto;
        font-size: 11px;
        color: #7ee787;
        white-space: nowrap;
      }
      select,
      input[type='number'],
      button {
        background: #0d1117;
        color: #e6edf3;
        border: 1px solid #30363d;
        border-radius: 5px;
        padding: 5px 6px;
        font-size: 13px;
      }
      button {
        cursor: pointer;
        background: #21262d;
      }
      button:hover {
        background: #30363d;
      }
      .stats-panel h3 {
        margin: 12px 0 4px;
        font-size: 14px;
        color: #79c0ff;
      }
      .stat-phase {
        color: #8b949e;
        margin-bottom: 8px;
        font-size: 12px;
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 2px 0;
        border-bottom: 1px dotted #21262d;
      }
      .stat-row span {
        color: #8b949e;
      }
      .stat-warning {
        background: #4a1d1d;
        border: 1px solid #f85149;
        border-radius: 5px;
        padding: 6px;
        margin-bottom: 8px;
        font-size: 12px;
      }
      .stat-note {
        color: #d29922;
        font-size: 11px;
        margin-top: 6px;
      }
      .stat-good {
        color: #3fb950;
        font-size: 11px;
        margin-top: 6px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
        font-size: 11px;
        color: #8b949e;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 3px;
        vertical-align: middle;
      }
      hr {
        border: none;
        border-top: 1px solid #30363d;
        margin: 8px 0;
      }
      /* --- Race panel (SPEC 8.3) --- */
      .race-banner {
        margin: 8px 0 4px;
        padding: 8px;
        border-radius: 6px;
        text-align: center;
        font-weight: bold;
        background: #21262d;
      }
      .race-banner.player {
        background: #1b4721;
        color: #7ee787;
      }
      .race-banner.ai {
        background: #3a2a5e;
        color: #b388ff;
      }
      .race-table,
      .bench-table,
      .bench-summary {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        margin-top: 6px;
      }
      .race-table th,
      .race-table td,
      .bench-summary th,
      .bench-summary td {
        padding: 3px 5px;
        border-bottom: 1px solid #21262d;
        text-align: right;
      }
      .race-table td:first-child,
      .bench-summary td:first-child {
        text-align: left;
        color: #8b949e;
      }
      .race-table td.win {
        color: #7ee787;
        font-weight: bold;
      }
      /* --- Benchmark panel (SPEC 8.4) --- */
      .table-scroll {
        overflow-x: auto;
        max-height: 55vh;
        overflow-y: auto;
        border: 1px solid #21262d;
        border-radius: 6px;
        margin-top: 6px;
      }
      .bench-table th,
      .bench-table td {
        padding: 3px 6px;
        border-bottom: 1px solid #21262d;
        text-align: right;
        white-space: nowrap;
      }
      .bench-table th {
        position: sticky;
        top: 0;
        background: #21262d;
        cursor: pointer;
        user-select: none;
      }
      .bench-table th:hover {
        background: #30363d;
      }
      .bench-table td.optimal,
      .bench-summary td.optimal {
        color: #3fb950;
        font-weight: bold;
      }
      .bench-summary th {
        background: #21262d;
      }
      .csv-button {
        margin-top: 8px;
      }
      h4 {
        margin: 12px 0 2px;
        font-size: 12px;
        color: #8b949e;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-container"></div>
      <aside id="sidebar"></aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
